[workspace]
resolver = "2"
members = [
    "crates/harbor-core",
    "crates/harbor-store",
    "crates/harbor-engine",
    "crates/harbor-agent",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
arboard = "3"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
fslock = "0.2"
futures-util = "0.3"
hex = "0.4"
keyring = "3"
notify-rust = "4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
suppaftp = "6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
