<!doctype html>
<html lang="en">
  <head>

    <title>Harbor</title>

      body { font: 13px "Segoe UI", sans-serif; margin: 0; width: 240px; background: #142028; color: #e7eef3; }

      label { display: flex; gap: 8px; align-items: center; }

      p { color: #93a3ae; min-height: 1.2em; }

  <body>
    <main>

    </main>
    <script src="popup.js"></script>
  </body>
</html>
