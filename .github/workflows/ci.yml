name: Build

on:
  push:
  pull_request:

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Test the download engine
        run: cargo test -p harbor-core -p harbor-store -p harbor-engine -p harbor-agent
      - name: Build the agent
        run: cargo build -p harbor-agent --release
